<!doctype html>
<!-- Made with paprika3d · https://paprika3d.com -->
<html lang="en"><head><meta charset="utf-8"><title>Hide in the Flock</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#9fdcf5;overflow:hidden;font-family:"Arial Rounded MT Bold","Nunito","Segoe UI",system-ui,sans-serif;user-select:none}
canvas{display:block}
.panel{position:fixed;background:rgba(27,42,26,.78);color:#fdfdec;border-radius:14px;padding:10px 14px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#hud{z-index:10;top:12px;left:14px;min-width:200px}
#hud .row{display:flex;align-items:center;gap:10px;margin:3px 0;font-weight:800;font-size:19px;letter-spacing:.5px}
#hud .lab{font-size:11px;opacity:.75;width:74px;text-transform:uppercase;letter-spacing:1.5px}
#time{font-size:30px;font-variant-numeric:tabular-nums}
.pip{display:inline-block;width:16px;height:16px;border-radius:50%;background:#e0302a;border:2px solid #fdfdec;margin-right:4px;transition:transform .3s,background .3s}
@keyframes pipPop{0%{transform:scale(1.8)}40%{transform:scale(.3) rotate(25deg)}100%{transform:scale(.6)}}
.pip.off{animation:pipPop .5s;background:#555;transform:scale(.6);border-color:#888}
.clv{display:inline-block;width:16px;height:16px;border-radius:50% 50% 50% 8%;background:#444;margin-right:4px;border:2px solid #fdfdec;transition:background .3s}
.clv.on{background:#6fd33a}
#sbar{width:120px;height:12px;border-radius:6px;background:#0006;overflow:hidden;border:2px solid #fdfdec55}
#sfill{height:100%;width:0;background:linear-gradient(90deg,#f2e04a,#e0302a)}
#mode{z-index:10;top:12px;right:14px;text-align:right;font-weight:800;font-size:15px;line-height:1.45}
#mode b{color:#ffe36a}
#mode small{opacity:.8;font-weight:600;font-size:12px;display:block}
#toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);font-weight:800;font-size:22px;color:#fdfdec;background:#1b2a1acc;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#bars i{position:fixed;left:0;right:0;height:0;background:#000;z-index:5;pointer-events:none}
#bt{top:0}#bb{bottom:0}
#cap{position:fixed;left:0;right:0;bottom:2.2vh;text-align:center;color:#fdfdec;font:italic 700 clamp(14px,2vw,26px) Georgia,serif;text-shadow:0 2px 6px #000;opacity:0;z-index:6;pointer-events:none}
#reveal{position:fixed;left:0;right:0;top:17vh;text-align:center;z-index:7;pointer-events:none;opacity:0}
#reveal .band{position:absolute;left:0;right:0;top:50%;height:26vh;transform:translateY(-50%);background:linear-gradient(90deg,transparent,#2a4a2a40 15%,#2a4a2a40 85%,transparent)}
#rk,#rbig,#rsub{position:relative}
#rk{font-weight:800;font-size:clamp(14px,2.2vw,30px);letter-spacing:6px;color:#ffe36a;text-transform:uppercase}
#rbig{font-weight:900;font-size:clamp(50px,11vw,170px);line-height:1;color:#fdfdec;-webkit-text-stroke:.04em #1b2a1a;paint-order:stroke fill;text-shadow:0 .05em 0 #1b2a1a,0 0 40px #0008;transform:rotate(-3deg)}
#rsub{font-weight:700;font-size:clamp(14px,2vw,28px);color:#fdfdec;margin-top:6px}
#bubble,#tag{position:fixed;z-index:8;display:none;pointer-events:none;transform:translate(-30%,-100%);font-weight:900}
#bubble{background:#fff;color:#222;padding:8px 18px;border-radius:22px;font-size:clamp(20px,3vw,40px);border:4px solid #222}
#bubble:after{content:"";position:absolute;left:30%;bottom:-18px;border:10px solid transparent;border-top:12px solid #222}
#tag{background:#e0302a;color:#fff;padding:6px 14px;border-radius:8px;font-size:clamp(16px,2.2vw,30px);letter-spacing:3px;border:3px solid #fff}
#flash{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;background:#fff}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,#e0302a 130%)}
@media(max-width:640px){#hud{top:6px;left:6px;min-width:0;padding:6px 10px}#hud .row{font-size:17px;margin:1px 0}#hud .lab{width:74px;font-size:12px}#time{font-size:20px}#sbar{width:90px}#mode{top:auto;bottom:8px;right:6px;font-size:12px;padding:6px 10px}#mode small{display:none}#toast{top:auto;bottom:60px;font-size:16px}}
</style></head><body>
<div id="hud" class="panel">
 <div class="row"><span class="lab">Time</span><span id="time">3:00</span></div>
 <div class="row" id="rclv"><span class="lab">Clovers</span><span id="clv"></span></div>
 <div class="row"><span class="lab">Wolf bites</span><span id="pips"></span></div>
 <div class="row" id="rsus"><span class="lab">Suspicion</span><div id="sbar"><div id="sfill"></div></div></div>
</div>
<div id="mode" class="panel"><div>[M] Mode: <b id="mname">SOLO</b></div><small id="ctl"></small></div>
<div id="toast"></div>
<div id="bars"><i id="bt"></i><i id="bb"></i></div>
<div id="vig"></div>
<div id="cap"></div>
<div id="reveal"><div class="band"></div><div id="rk"></div><div id="rbig"></div><div id="rsub"></div></div>
<div id="bubble">baa?</div><div id="tag">PLAYER 1</div>
<div id="flash"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="./game.js"></script>
</body></html>
